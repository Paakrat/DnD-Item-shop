<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mystical Magic Items Shop</title>

    <style>
        :root {
            --bg-main: #050816;
            --bg-panel: rgba(15, 23, 42, 0.9);
            --bg-card: rgba(15, 23, 42, 0.95);
            --accent: #6366f1;
            --accent-soft: rgba(99, 102, 241, 0.2);
            --accent-strong: #4f46e5;
            --border-subtle: rgba(148, 163, 184, 0.3);
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --text-strong: #f9fafb;
            --danger: #f97373;
            --success: #22c55e;
            --shadow-soft: 0 18px 40px rgba(15, 23, 42, 0.6);
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-pill: 999px;
            --transition-fast: 0.18s ease-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #111827 0, #020617 45%, #020617 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
        }

        .app-shell {
            max-width: 1280px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 3fr) minmax(260px, 320px);
            gap: 24px;
        }

        /* HEADER */

        .header {
            grid-column: 1 / -1;
            background: radial-gradient(circle at top left, rgba(99, 102, 241, 0.18), transparent 55%),
                        radial-gradient(circle at top right, rgba(236, 72, 153, 0.14), transparent 55%),
                        linear-gradient(to right, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.98));
            border-radius: var(--radius-lg);
            padding: 20px 22px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            border: 1px solid rgba(148, 163, 184, 0.45);
            box-shadow: var(--shadow-soft);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-icon {
            width: 44px;
            height: 44px;
            border-radius: 16px;
            background: radial-gradient(circle at top, #e5e7eb 0, #4b5563 55%, #020617 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.9rem;
            box-shadow: 0 15px 30px rgba(15, 23, 42, 0.75);
        }

        .header-title {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .header-title h1 {
            font-size: clamp(1.4rem, 2.15vw, 1.9rem);
            font-weight: 650;
            letter-spacing: 0.03em;
            color: var(--text-strong);
        }

        .header-title p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .header-right {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: flex-end;
        }

        .pill {
            border-radius: var(--radius-pill);
            padding: 4px 12px;
            font-size: 0.78rem;
            border: 1px solid rgba(148, 163, 184, 0.55);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pill-dot {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: #22c55e;
        }

        /* FILTER BAR + LIST */

        .items-panel {
            background: rgba(15, 23, 42, 0.96);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            padding: 18px 18px 20px;
            backdrop-filter: blur(18px);
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .filters-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .filters-left {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            border-radius: var(--radius-pill);
            border: 1px solid rgba(148, 163, 184, 0.5);
            padding: 6px 12px;
            font-size: 0.8rem;
            background: rgba(15, 23, 42, 0.9);
            color: var(--text-muted);
            cursor: pointer;
            transition: background var(--transition-fast), color var(--transition-fast),
                        border-color var(--transition-fast), transform var(--transition-fast);
        }

        .filter-btn:hover {
            border-color: rgba(148, 163, 184, 0.9);
            color: var(--text-strong);
            transform: translateY(-1px);
        }

        .filter-btn.active {
            background: var(--accent);
            color: #f9fafb;
            border-color: transparent;
        }

        .search-box {
            position: relative;
            max-width: 220px;
            flex: 1 1 auto;
        }

        .search-box input {
            width: 100%;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-subtle);
            padding: 7px 10px 7px 28px;
            background: rgba(15, 23, 42, 0.9);
            color: var(--text-main);
            font-size: 0.8rem;
        }

        .search-box input::placeholder {
            color: #6b7280;
        }

        .search-box-icon {
            position: absolute;
            left: 9px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.85rem;
            color: #6b7280;
        }

        /* ITEMS GRID */

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 14px;
        }

        .item-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid rgba(148, 163, 184, 0.35);
            padding: 14px 14px 13px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform var(--transition-fast),
                        box-shadow var(--transition-fast),
                        border-color var(--transition-fast),
                        background var(--transition-fast);
            position: relative;
            overflow: hidden;
        }

        .item-card::before {
            content: "";
            position: absolute;
            inset: 0;
            opacity: 0;
            background: radial-gradient(circle at top left, rgba(99, 102, 241, 0.22), transparent 60%);
            transition: opacity var(--transition-fast);
            pointer-events: none;
        }

        .item-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 35px rgba(15, 23, 42, 0.8);
            border-color: rgba(129, 140, 248, 0.8);
        }

        .item-card:hover::before {
            opacity: 1;
        }

        .item-header {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            gap: 10px;
            align-items: center;
        }

        .item-image {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: radial-gradient(circle at top, #1f2937 0, #020617 85%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(148, 163, 184, 0.6);
            flex-shrink: 0;
        }

        .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .fallback-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            opacity: 0.9;
        }

        .item-main {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .item-name {
            font-size: 0.97rem;
            font-weight: 600;
            color: var(--text-strong);
        }

        .item-type {
            font-size: 0.76rem;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            color: var(--text-muted);
        }

        .item-tags {
            margin-top: 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .tag-pill {
            border-radius: var(--radius-pill);
            padding: 2px 9px;
            font-size: 0.7rem;
            border: 1px solid rgba(148, 163, 184, 0.5);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .rarity-dot {
            width: 6px;
            height: 6px;
            border-radius: 999px;
        }

        .rarity-common {
            background: #9ca3af;
        }

        .rarity-uncommon {
            background: #22c55e;
        }

        .rarity-rare {
            background: #3b82f6;
        }

        .rarity-very-rare {
            background: #a855f7;
        }

        .rarity-legendary {
            background: #f97316;
        }

        .item-description {
            font-size: 0.78rem;
            line-height: 1.45;
            color: var(--text-main);
            max-height: 5.6em;
            overflow: hidden;
            position: relative;
        }

        .item-description::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1.5em;
            background: linear-gradient(to bottom, transparent, var(--bg-card));
        }

        .item-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 6px;
        }

        .item-price {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent);
        }

        .item-price span {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .select-btn {
            border-radius: var(--radius-pill);
            border: none;
            padding: 7px 14px;
            font-size: 0.8rem;
            font-weight: 550;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-soft);
            color: var(--accent-strong);
            transition: background var(--transition-fast), color var(--transition-fast),
                        transform var(--transition-fast), box-shadow var(--transition-fast);
            white-space: nowrap;
        }

        .select-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.75);
            background: rgba(129, 140, 248, 0.24);
        }

        .select-btn.selected {
            background: rgba(34, 197, 94, 0.16);
            color: var(--success);
        }

        .select-btn-icon {
            font-size: 0.9rem;
        }

        /* CART PANEL */

        .cart-panel {
            background: var(--bg-panel);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            padding: 16px 15px 15px;
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-soft);
            max-height: calc(100vh - 48px);
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: sticky;
            top: 24px;
        }

        .cart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .cart-header-left {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .cart-icon {
            width: 26px;
            height: 26px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(148, 163, 184, 0.7);
            font-size: 0.9rem;
        }

        .cart-header-left h3 {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .cart-count {
            font-size: 0.73rem;
            color: var(--text-muted);
        }

        .cart-body {
            flex: 1 1 auto;
            overflow-y: auto;
            min-height: 70px;
            max-height: 360px;
            padding-right: 2px;
        }

        .cart-empty {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            padding: 26px 8px;
        }

        .cart-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 4px 10px;
            align-items: center;
            padding: 7px 8px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.4);
            font-size: 0.78rem;
            margin-bottom: 6px;
        }

        .cart-item-name {
            font-weight: 500;
            color: var(--text-strong);
        }

        .cart-item-price {
            text-align: right;
            color: var(--accent);
            font-weight: 500;
        }

        .cart-item-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .cart-remove-btn {
            border: none;
            background: transparent;
            color: #6b7280;
            font-size: 0.8rem;
            cursor: pointer;
            justify-self: flex-end;
        }

        .cart-remove-btn:hover {
            color: var(--danger);
        }

        .cart-footer {
            border-top: 1px solid rgba(148, 163, 184, 0.35);
            padding-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .cart-summary {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 0.85rem;
        }

        .cart-summary-label {
            color: var(--text-muted);
        }

        .cart-summary-value {
            color: var(--text-strong);
            font-weight: 600;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 0.92rem;
        }

        .cart-total-label {
            color: var(--text-muted);
        }

        .cart-total-value {
            color: var(--accent);
            font-weight: 650;
        }

        .checkout-btn {
            margin-top: 4px;
            border-radius: var(--radius-pill);
            border: none;
            padding: 8px 13px;
            font-size: 0.8rem;
            font-weight: 550;
            cursor: pointer;
            background: linear-gradient(to right, var(--accent-strong), #ec4899);
            color: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            box-shadow: 0 10px 25px rgba(129, 140, 248, 0.6);
            transition: transform var(--transition-fast), box-shadow var(--transition-fast),
                        filter var(--transition-fast);
        }

        .checkout-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 13px 30px rgba(129, 140, 248, 0.75);
            filter: brightness(1.03);
        }

        .checkout-btn:active {
            transform: translateY(0);
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.9);
        }

        /* SCROLLBAR */

        .cart-body::-webkit-scrollbar {
            width: 5px;
        }
        .cart-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .cart-body::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.5);
            border-radius: 999px;
        }

        /* RESPONSIVE */

        @media (max-width: 900px) {
            body {
                padding: 16px;
            }

            .app-shell {
                grid-template-columns: minmax(0, 1fr);
            }

            .cart-panel {
                order: 2;
                position: static;
                max-height: none;
            }

            .items-panel {
                order: 3;
            }

            .header {
                order: 1;
            }
        }
    </style>
</head>

<div class="app-shell">
    <header class="header">
        <div class="header-left">
            <div class="header-icon">🔮</div>
            <div class="header-title">
                <h1>Mystical Magic Items</h1>
                <p>Curate a loadout of potions, trinkets, and legendary artifacts.</p>
            </div>
        </div>
        <div class="header-right">
            <div class="pill">
                <span class="pill-dot"></span>
                Live pricing for this session
            </div>
            <div class="pill">
                Rarities: Common → Legendary
            </div>
        </div>
    </header>

    <main class="items-panel">
        <div class="filters-row">
            <div class="filters-left">
                <button class="filter-btn active" data-rarity="all">All</button>
                <button class="filter-btn" data-rarity="common">Common</button>
                <button class="filter-btn" data-rarity="uncommon">Uncommon</button>
                <button class="filter-btn" data-rarity="rare">Rare</button>
                <button class="filter-btn" data-rarity="very-rare">Very Rare</button>
                <button class="filter-btn" data-rarity="legendary">Legendary</button>
            </div>
            <div class="search-box">
                <span class="search-box-icon">🔍</span>
                <input id="search-input" type="text" placeholder="Search by name or type…" />
            </div>
        </div>

        <div class="items-grid" id="items-container"></div>
    </main>

    <aside class="cart-panel">
        <div class="cart-header">
            <div class="cart-header-left">
                <div class="cart-icon">🛒</div>
                <div>
                    <h3>Selected Items</h3>
                    <div class="cart-count">
                        <span id="item-count">0</span> items
                    </div>
                </div>
            </div>
        </div>
        <div class="cart-body" id="selected-list"></div>
        <div class="cart-footer">
            <div class="cart-summary">
                <span class="cart-summary-label">Average price</span>
                <span class="cart-summary-value" id="avg-price">–</span>
            </div>
            <div class="cart-total">
                <span class="cart-total-label">Total (gp)</span>
                <span class="cart-total-value" id="total-amount">0 gp</span>
            </div>
            <button class="checkout-btn" type="button">
                <span>Export for session</span>
                <span>⬇️</span>
            </button>
        </div>
    </aside>
</div>

    let selectedItems = [];
    let currentFilter = "all";
    let currentSearch = "";

    function renderItems() {
        const container = document.getElementById("items-container");
        const search = currentSearch.trim().toLowerCase();

        const filtered = magicItems.filter(item => {
            const matchesRarity = currentFilter === "all" || item.rarity === currentFilter;
            const matchesSearch =
                !search ||
                item.name.toLowerCase().includes(search) ||
                item.type.toLowerCase().includes(search);
            return matchesRarity && matchesSearch;
        });

        container.innerHTML = filtered
            .map(item => {
                const index = magicItems.indexOf(item);
                const isSelected = selectedItems.some(sel => sel.name === item.name);

                return `
                <article class="item-card" data-rarity="${item.rarity}">
                    <div class="item-header">
                        <div class="item-image">
                            ${item.imageUrl ? `<img src="${item.imageUrl}" alt="${item.name}" onerror="this.style.display='none'" />` : ""}
                            <div class="fallback-icon">${item.fallbackIcon || ""}</div>
                        </div>
                        <div class="item-main">
                            <div class="item-name">${item.name}</div>
                            <div class="item-type">${item.type}</div>
                            <div class="item-tags">
                                <span class="tag-pill">
                                    <span class="rarity-dot rarity-${item.rarity.replace(" ", "-")}"></span>
                                    <span>${item.rarity}</span>
                                </span>
                            </div>
                        </div>
                    </div>
                    <p class="item-description">${item.description}</p>
                    <div class="item-footer">
                        <div class="item-price">
                            ${item.price.toLocaleString()} gp
                            <span>/ each</span>
                        </div>
                        <button
                            class="select-btn ${isSelected ? "selected" : ""}"
                            data-index="${index}"
                            type="button"
                        >
                            <span class="select-btn-icon">${isSelected ? "✓" : "+"}</span>
                            <span>${isSelected ? "Selected" : "Add to cart"}</span>
                        </button>
                    </div>
                </article>
            `;
            })
            .join("");

        attachItemButtonHandlers();
    }

    function attachItemButtonHandlers() {
        document.querySelectorAll(".select-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const index = parseInt(btn.dataset.index, 10);
                const item = magicItems[index];
                if (!item) return;
                toggleItem(item);
            });
        });
    }

    function toggleItem(item) {
        const existingIndex = selectedItems.findIndex(sel => sel.name === item.name);

        if (existingIndex > -1) {
            selectedItems.splice(existingIndex, 1);
        } else {
            selectedItems.push({
                name: item.name,
                price: item.price,
                rarity: item.rarity
            });
        }

        updateSelectedList();
        renderItems();
    }

    function updateSelectedList() {
        const selectedList = document.getElementById("selected-list");
        const totalAmountEl = document.getElementById("total-amount");
        const itemCountEl = document.getElementById("item-count");
        const avgPriceEl = document.getElementById("avg-price");

        if (selectedItems.length === 0) {
            selectedList.innerHTML = `<div class="cart-empty">
                No items selected. Add items on the left to build a loadout.
            </div>`;
            totalAmountEl.textContent = "0 gp";
            itemCountEl.textContent = "0";
            avgPriceEl.textContent = "–";
            return;
        }

        selectedList.innerHTML = selectedItems
            .map(item => {
                return `
                <div class="cart-item">
                    <div>
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-meta">${item.rarity}</div>
                    </div>
                    <div class="cart-item-price">
                        ${item.price.toLocaleString()} gp
                    </div>
                    <button class="cart-remove-btn" data-name="${item.name}" type="button">
                        Remove
                    </button>
                </div>
            `;
            })
            .join("");

        const total = selectedItems.reduce((sum, item) => sum + item.price, 0);
        const avg = Math.round(total / selectedItems.length);

        totalAmountEl.textContent = `${total.toLocaleString()} gp`;
        itemCountEl.textContent = selectedItems.length.toString();
        avgPriceEl.textContent = `${avg.toLocaleString()} gp`;

        document.querySelectorAll(".cart-remove-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                const name = btn.dataset.name;
                const index = selectedItems.findIndex(i => i.name === name);
                if (index > -1) {
                    selectedItems.splice(index, 1);
                    updateSelectedList();
                    renderItems();
                }
            });
        });
    }

    // Filter buttons
    document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", e => {
            document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
            e.currentTarget.classList.add("active");
            currentFilter = e.currentTarget.dataset.rarity;
            renderItems();
        });
    });

    // Search
    document.getElementById("search-input").addEventListener("input", e => {
        currentSearch = e.target.value || "";
        renderItems();
    });

    // Initial render
    renderItems();
    updateSelectedList();
</script>
